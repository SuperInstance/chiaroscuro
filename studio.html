<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASCII MIRROR — STUDIO</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #050507; font-family: 'Courier New', monospace; }
#stage { position: absolute; inset: 0 340px 0 0; display: flex; align-items: center; justify-content: center; }
canvas { max-width: 100%; max-height: 100%; }
#panel {
  position: absolute; top: 0; right: 0; bottom: 0; width: 340px;
  background: rgba(10, 10, 14, 0.96); border-left: 1px solid #26263a;
  overflow-y: auto; padding: 12px 14px 90px; color: #b9b9c9; scrollbar-width: thin;
}
h1 { font-size: 13px; letter-spacing: 3px; color: #8f7fff; margin-bottom: 8px; }
.group { border: 1px solid #20202e; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
.group > .gtitle { font-size: 10px; letter-spacing: 2px; color: #6a6a88; text-transform: uppercase; cursor: pointer; user-select: none; }
.row { display: flex; align-items: center; justify-content: space-between; margin: 5px 0; gap: 8px; }
.row label { font-size: 11px; color: #9a9ab0; flex: 0 0 92px; }
.row input[type=range] { flex: 1; accent-color: #8f7fff; height: 14px; }
.row .val { font-size: 10px; color: #6a6a88; width: 30px; text-align: right; }
.row select, .row input[type=text] { flex: 1; background: #16161f; color: #c9c9dd; border: 1px solid #2a2a3a; border-radius: 4px; font-family: inherit; font-size: 11px; padding: 3px; }
.row input[type=color] { width: 40px; height: 20px; border: none; background: none; }
.row input[type=checkbox] { accent-color: #8f7fff; }
#presets { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
#presets button {
  background: #191926; color: #a9a9c5; border: 1px solid #2c2c40; border-radius: 4px;
  font-family: inherit; font-size: 10px; padding: 4px 7px; cursor: pointer;
}
#presets button:hover { background: #2a2a44; color: #fff; }
#actions { position: sticky; bottom: 0; background: rgba(10,10,14,0.97); padding: 8px 0 4px; display: flex; gap: 6px; }
#actions button { flex: 1; background: #26264a; color: #cfcfe6; border: 1px solid #3d3d6a; border-radius: 6px; font-family: inherit; font-size: 11px; padding: 7px 0; cursor: pointer; letter-spacing: 1px; }
#actions button:hover { background: #38386a; }
#camnote { position: absolute; top: 12px; left: 16px; font-size: 11px; color: #4a4a5e; z-index: 5; }
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="camnote">ASCII MIRROR — STUDIO</div>
<div id="panel">
  <h1>∷ STUDIO</h1>

  <div class="group" id="g-presets">
    <div class="gtitle">Presets</div>
    <div id="presets"></div>
  </div>

  <div class="group"><div class="gtitle">Grid &amp; Glyphs</div><div id="c-grid"></div></div>
  <div class="group"><div class="gtitle">Image</div><div id="c-image"></div></div>
  <div class="group"><div class="gtitle">Engine</div><div id="c-engine"></div></div>
  <div class="group"><div class="gtitle">Sculpt (Relief)</div><div id="c-sculpt"></div></div>
  <div class="group"><div class="gtitle">Color</div><div id="c-color"></div></div>
  <div class="group"><div class="gtitle">Atmosphere</div><div id="c-atmo"></div></div>

  <div id="actions">
    <button id="btn-random">⤫ RANDOMIZE</button>
    <button id="btn-share">⇪ SHARE</button>
  </div>
</div>

<script>
"use strict";
// ============ ASCII MIRROR — STUDIO ============
// One parametric pipeline, many dimensions. Presets reproduce
// the Original (v1) and the Sculptor (v2) plus new worlds.

const MOCK = new URLSearchParams(location.search).has('mock');
const video = document.createElement('video');
const buf = document.createElement('canvas');
const bctx = buf.getContext('2d', { willReadFrequently: true });
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

// ---------- parameter definitions ----------
const P = {}; // live values
const DEFS = {
  grid: [
    { k: 'density', label: 'Density', min: 30, max: 200, v: 100 },
    { k: 'cellAspect', label: 'Cell shape', min: 40, max: 80, v: 60 },   // width as % of height
    { k: 'glyphSize', label: 'Glyph scale', min: 70, max: 130, v: 100 },
    { k: 'mirror', label: 'Mirror flip', type: 'check', v: true },
    { k: 'fps', label: 'FPS cap', min: 5, max: 60, v: 30 },
  ],
  image: [
    { k: 'brightness', label: 'Brightness', min: -100, max: 100, v: 0 },
    { k: 'contrast', label: 'Contrast', min: 10, max: 90, v: 25 },
    { k: 'gamma', label: 'Gamma', min: 40, max: 250, v: 100 },          // /100
    { k: 'invert', label: 'Invert', type: 'check', v: false },
  ],
  engine: [
    { k: 'ramp', label: 'Tone ramp', type: 'select', options: {
      classic: " .:-=+*#%@@",
      fine: " .'`^\",:;Il!i><~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$",
      blocks: " ░▒▓█",
      dense: "░▒▓█▓▒░▒▓██████",
      minimal: " .:*#",
      stars: "·∴∴∗✦✱✳❋█",
      hearts: "·˚♡♥♥❤█",
      runic: "·ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃ█",
      braillefine: "⠁⠓⠭⠷⠿⡿⣿",
      custom: ""
    }, v: 'classic' },
    { k: 'rampCustom', label: 'Custom ramp', type: 'text', v: "", placeholder: 'type glyphs…' },
    { k: 'toneAmt', label: 'Tone mix', min: 0, max: 100, v: 100 },
    { k: 'edgeAmt', label: 'Edge/relief mix', min: 0, max: 100, v: 0 },
    { k: 'edgeGain', label: 'Edge gain', min: 1, max: 15, v: 8 },
    { k: 'brailleAmt', label: 'Braille detail', min: 0, max: 100, v: 0 },
    { k: 'dither', label: 'Dither', min: 0, max: 100, v: 0 },
  ],
  sculpt: [
    { k: 'lightAngle', label: 'Light angle', min: 0, max: 360, v: 315 },
    { k: 'relief', label: 'Relief', min: 0, max: 100, v: 55 },
    { k: 'edgeThresh', label: 'Edge threshold', min: 1, max: 12, v: 4 },  // /100 mag
  ],
  color: [
    { k: 'colMode', label: 'Mode', type: 'select', options: { original: 'Original color', phosphor: 'Phosphor', duotone: 'Duotone', heatmap: 'Heatmap', ink: 'Ink on paper' }, v: 'original' },
    { k: 'hue', label: 'Phosphor hue', min: 0, max: 360, v: 120 },
    { k: 'sat', label: 'Saturation', min: 0, max: 200, v: 100 },
    { k: 'shadowCol', label: 'Duotone dark', type: 'color', v: '#0a1030' },
    { k: 'highCol', label: 'Duotone light', type: 'color', v: '#ffd166' },
    { k: 'bgCol', label: 'Background', type: 'color', v: '#050507' },
  ],
  atmo: [
    { k: 'grain', label: 'Grain', min: 0, max: 100, v: 0 },
    { k: 'scan', label: 'Scanlines', min: 0, max: 100, v: 0 },
    { k: 'vignette', label: 'Vignette', min: 0, max: 100, v: 0 },
    { k: 'bloom', label: 'Bloom', min: 0, max: 20, v: 0 },
  ],
};

function applyDefs() { for (const g in DEFS) for (const d of DEFS[g]) P[d.k] = d.v; }
applyDefs();

const RAMP_SETS = DEFS.engine.find(d => d.k === 'ramp').options;

// ---------- presets ----------
const PRESETS = {
  '① The Original': { density:100, cellAspect:60, glyphSize:100, mirror:true, fps:30, brightness:0, contrast:25, gamma:100, invert:false, ramp:'classic', rampCustom:'', toneAmt:100, edgeAmt:0, edgeGain:8, brailleAmt:0, dither:0, lightAngle:315, relief:0, edgeThresh:4, colMode:'original', hue:120, sat:100, shadowCol:'#0a1030', highCol:'#ffd166', bgCol:'#050507', grain:0, scan:0, vignette:0, bloom:0 },
  '② The Sculptor': { density:100, cellAspect:60, glyphSize:100, mirror:true, fps:30, brightness:0, contrast:25, gamma:100, invert:false, ramp:'fine', rampCustom:'', toneAmt:100, edgeAmt:100, edgeGain:8, brailleAmt:45, dither:0, lightAngle:315, relief:55, edgeThresh:4, colMode:'original', hue:120, sat:100, shadowCol:'#0a1030', highCol:'#ffd166', bgCol:'#030304', grain:0, scan:0, vignette:0, bloom:0 },
  'Green Matrix':   { density:130, cellAspect:55, glyphSize:95, mirror:true, fps:30, brightness:5, contrast:40, gamma:90, invert:false, ramp:'classic', rampCustom:'', toneAmt:100, edgeAmt:20, edgeGain:10, brailleAmt:20, dither:30, lightAngle:315, relief:25, edgeThresh:4, colMode:'phosphor', hue:120, sat:100, shadowCol:'#0a1030', highCol:'#ffd166', bgCol:'#000f00', grain:35, scan:60, vignette:55, bloom:8 },
  'Amber Terminal': { density:110, cellAspect:60, glyphSize:100, mirror:true, fps:24, brightness:0, contrast:45, gamma:85, invert:false, ramp:'fine', rampCustom:'', toneAmt:100, edgeAmt:15, edgeGain:9, brailleAmt:10, dither:0, lightAngle:315, relief:20, edgeThresh:4, colMode:'phosphor', hue:36, sat:110, shadowCol:'#0a1030', highCol:'#ffd166', bgCol:'#140a00', grain:25, scan:70, vignette:60, bloom:6 },
  'Ink & Paper':    { density:120, cellAspect:60, glyphSize:100, mirror:true, fps:30, brightness:10, contrast:35, gamma:110, invert:true, ramp:'fine', rampCustom:'', toneAmt:100, edgeAmt:35, edgeGain:11, brailleAmt:15, dither:20, lightAngle:315, relief:35, edgeThresh:3, colMode:'ink', hue:220, sat:0, shadowCol:'#0a1030', highCol:'#ffd166', bgCol:'#f2efe6', grain:15, scan:0, vignette:0, bloom:0 },
  'Blueprint':      { density:100, cellAspect:60, glyphSize:100, mirror:true, fps:30, brightness:0, contrast:50, gamma:80, invert:false, ramp:'minimal', rampCustom:'', toneAmt:25, edgeAmt:100, edgeGain:14, brailleAmt:0, dither:0, lightAngle:135, relief:70, edgeThresh:3, colMode:'duotone', hue:220, sat:0, shadowCol:'#062a66', highCol:'#cfe6ff', bgCol:'#031233', grain:8, scan:0, vignette:30, bloom:0 },
  'Neon Noir':      { density:120, cellAspect:55, glyphSize:105, mirror:true, fps:30, brightness:-5, contrast:55, gamma:85, invert:false, ramp:'blocks', rampCustom:'', toneAmt:80, edgeAmt:60, edgeGain:10, brailleAmt:35, dither:0, lightAngle:45, relief:65, edgeThresh:4, colMode:'duotone', hue:300, sat:0, shadowCol:'#2a004f', highCol:'#00f6ff', bgCol:'#05000c', grain:30, scan:25, vignette:65, bloom:14 },
  'Ghost':          { density:90, cellAspect:60, glyphSize:100, mirror:true, fps:20, brightness:0, contrast:30, gamma:140, invert:true, ramp:'stars', rampCustom:'', toneAmt:100, edgeAmt:25, edgeGain:8, brailleAmt:30, dither:15, lightAngle:270, relief:40, edgeThresh:5, colMode:'phosphor', hue:180, sat:30, shadowCol:'#0a1030', highCol:'#ffd166', bgCol:'#0b0d12', grain:20, scan:0, vignette:45, bloom:10 },
  'Wireframe':      { density:80, cellAspect:60, glyphSize:110, mirror:true, fps:30, brightness:0, contrast:55, gamma:70, invert:false, ramp:'minimal', rampCustom:'', toneAmt:0, edgeAmt:100, edgeGain:15, brailleAmt:0, dither:0, lightAngle:315, relief:80, edgeThresh:5, colMode:'phosphor', hue:150, sat:80, shadowCol:'#0a1030', highCol:'#ffd166', bgCol:'#020403', grain:0, scan:0, vignette:35, bloom:4 },
  'Molten':         { density:110, cellAspect:60, glyphSize:100, mirror:true, fps:30, brightness:0, contrast:40, gamma:95, invert:false, ramp:'blocks', rampCustom:'', toneAmt:90, edgeAmt:40, edgeGain:9, brailleAmt:20, dither:25, lightAngle:90, relief:50, edgeThresh:4, colMode:'heatmap', hue:30, sat:120, shadowCol:'#0a1030', highCol:'#ffd166', bgCol:'#0c0200', grain:20, scan:0, vignette:50, bloom:12 },
  'Deep Sea':       { density:95, cellAspect:62, glyphSize:100, mirror:true, fps:20, brightness:-10, contrast:35, gamma:120, invert:false, ramp:'runes', rampCustom:'', toneAmt:85, edgeAmt:45, edgeGain:10, brailleAmt:25, dither:10, lightAngle:200, relief:55, edgeThresh:4, colMode:'duotone', hue:200, sat:0, shadowCol:'#001220', highCol:'#7fd4c1', bgCol:'#01080f', grain:15, scan:0, vignette:60, bloom:6 },
  'Pulp Comic':     { density:70, cellAspect:60, glyphSize:125, mirror:true, fps:30, brightness:10, contrast:65, gamma:75, invert:false, ramp:'dense', rampCustom:'', toneAmt:100, edgeAmt:70, edgeGain:13, brailleAmt:0, dither:0, lightAngle:315, relief:45, edgeThresh:6, colMode:'original', hue:120, sat:170, shadowCol:'#0a1030', highCol:'#ffd166', bgCol:'#fff8ee', grain:10, scan:0, vignette:0, bloom:0 },
};

// ---------- UI construction ----------
function buildGroup(groupId, defs) {
  const host = document.getElementById(groupId);
  for (const d of defs) {
    const row = document.createElement('div'); row.className = 'row';
    const lab = document.createElement('label'); lab.textContent = d.label; row.appendChild(lab);
    if (d.type === 'check') {
      const el = document.createElement('input'); el.type = 'checkbox'; el.checked = d.v;
      el.addEventListener('change', () => P[d.k] = el.checked); row.appendChild(el);
    } else if (d.type === 'select') {
      const el = document.createElement('select');
      for (const name in d.options) { const o = document.createElement('option'); o.value = name; o.textContent = name; el.appendChild(o); }
      el.value = d.v;
      el.addEventListener('change', () => P[d.k] = el.value); row.appendChild(el);
    } else if (d.type === 'color') {
      const el = document.createElement('input'); el.type = 'color'; el.value = d.v;
      el.addEventListener('input', () => P[d.k] = el.value); row.appendChild(el);
    } else if (d.type === 'text') {
      const el = document.createElement('input'); el.type = 'text'; el.placeholder = d.placeholder || '';
      el.addEventListener('input', () => P[d.k] = el.value); row.appendChild(el);
    } else {
      const el = document.createElement('input'); el.type = 'range'; el.min = d.min; el.max = d.max; el.value = d.v;
      const val = document.createElement('span'); val.className = 'val'; val.textContent = d.v;
      el.addEventListener('input', () => { P[d.k] = +el.value; val.textContent = el.value; });
      row.appendChild(el); row.appendChild(val);
      d._el = el; d._val = val;
    }
    host.appendChild(row);
  }
}
for (const g of ['grid','image','engine','sculpt','color','atmo']) buildGroup('c-' + g, DEFS[g]);

function setParam(k, v) {
  P[k] = v;
  for (const g in DEFS) for (const d of DEFS[g]) {
    if (d.k === k) {
      if (d._el) { d._el.value = v; if (d._val) d._val.textContent = v; }
      else if (d.type === 'check') { const el = d._elRef || (d._elRef = document.querySelector(`#c-${g} input[type=checkbox]`)); }
    }
  }
}
function refreshUI() {
  for (const g in DEFS) {
    const host = document.getElementById('c-' + g);
    const rows = host.children;
    DEFS[g].forEach((d, i) => {
      const row = rows[i];
      if (!row) return;
      const el = row.querySelector('input,select');
      if (!el) return;
      if (el.type === 'checkbox') el.checked = !!P[d.k];
      else if (el.type === 'color') el.value = P[d.k];
      else if (el.tagName === 'SELECT') el.value = P[d.k];
      else if (el.type === 'text') el.value = P[d.k];
      else { el.value = P[d.k]; const s = row.querySelector('.val'); if (s) s.textContent = P[d.k]; }
    });
  }
}
function applyPreset(name) {
  const pr = PRESETS[name]; if (!pr) return;
  Object.assign(P, pr); refreshUI();
}

const presetHost = document.getElementById('presets');
for (const name in PRESETS) {
  const b = document.createElement('button'); b.textContent = name;
  b.addEventListener('click', () => applyPreset(name));
  presetHost.appendChild(b);
}
document.getElementById('btn-random').addEventListener('click', () => {
  for (const g in DEFS) for (const d of DEFS[g]) {
    if (d.type === 'range') P[d.k] = Math.round(d.min + Math.random() * (d.max - d.min));
    else if (d.k === 'ramp') P[d.k] = Object.keys(RAMP_SETS)[Math.floor(Math.random() * (Object.keys(RAMP_SETS).length - 1))];
    else if (d.k === 'colMode') P[d.k] = ['original','phosphor','duotone','heatmap','ink'][Math.floor(Math.random()*5)];
    else if (d.type === 'color') P[d.k] = '#' + Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, '0');
    else if (d.type === 'check') P[d.k] = Math.random() < 0.2;
  }
  refreshUI();
});
document.getElementById('btn-share').addEventListener('click', () => {
  location.hash = encodeURIComponent(JSON.stringify(P));
  navigator.clipboard && navigator.clipboard.writeText(location.href).catch(()=>{});
});
// load shared settings from hash
try { const h = location.hash.slice(1); if (h) Object.assign(P, JSON.parse(decodeURIComponent(h))); } catch (e) {}
// ?preset=Name
{ const pn = new URLSearchParams(location.search).get('preset'); if (pn && PRESETS[pn]) Object.assign(P, PRESETS[pn]); }
refreshUI();

// group collapse
document.querySelectorAll('.gtitle').forEach(t => t.addEventListener('click', () => {
  const kids = [...t.parentElement.children].filter(c => c !== t);
  const hidden = kids[0] && kids[0].style.display === 'none';
  kids.forEach(c => c.style.display = hidden ? '' : 'none');
}));

// ---------- camera / mock ----------
async function initCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' }, audio: false });
    video.srcObject = stream; video.autoplay = true; video.playsInline = true;
    video.addEventListener('playing', () => requestAnimationFrame(loop));
  } catch (e) { console.error(e); alert('Webcam permission needed.'); }
}

// color transforms
function cellColor(r, g, b, lum) {
  const sat = P.sat / 100;
  const gray = 0.299 * r + 0.587 * g + 0.114 * b;
  r = gray + (r - gray) * sat; g = gray + (g - gray) * sat; b = gray + (b - gray) * sat;
  switch (P.colMode) {
    case 'phosphor': {
      const h = P.hue, s = Math.min(100, sat * 80), l = Math.min(92, lum * 0.85 + 4);
      return hslRgb(h, s, l);
    }
    case 'duotone': {
      const a = hexRgb(P.shadowCol), c = hexRgb(P.highCol), t = Math.max(0, Math.min(1, lum / 255));
      return [a[0] + (c[0]-a[0]) * t, a[1] + (c[1]-a[1]) * t, a[2] + (c[2]-a[2]) * t];
    }
    case 'heatmap': {
      const h = 300 - (lum / 255) * 300; // magenta -> red -> yellow -> green
      return hslRgb((h + 360) % 360, 85, Math.min(70, 20 + lum * 0.22));
    }
    case 'ink': {
      const v = 255 - lum; return [v, v, v];
    }
    default: return [r, g, b];
  }
}
function hslRgb(h, s, l) {
  s /= 100; l /= 100;
  const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2;
  let r = 0, g = 0, b = 0;
  if (h < 60) [r,g,b] = [c,x,0]; else if (h < 120) [r,g,b] = [x,c,0]; else if (h < 180) [r,g,b] = [0,c,x];
  else if (h < 240) [r,g,b] = [0,x,c]; else if (h < 300) [r,g,b] = [x,0,c]; else [r,g,b] = [c,0,x];
  return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
}
function hexRgb(hx) { const n = parseInt(hx.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }

// noise canvas for grain
const noise = document.createElement('canvas'); noise.width = noise.height = 256;
{ const nc = noise.getContext('2d'); const id = nc.createImageData(256, 256);
  for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = id.data[i+1] = id.data[i+2] = v; id.data[i+3] = 255; }
  nc.putImageData(id, 0, 0); }

// ramps cache
function activeRamp() {
  if (P.ramp === 'custom' && P.rampCustom) return P.rampCustom;
  return RAMP_SETS[P.ramp] || RAMP_SETS.classic;
}

let last = 0;
let SRC = null; // video element or mock canvas
function loop(ts) {
  requestAnimationFrame(loop);
  if (P.fps < 60 && ts - last < 1000 / P.fps) return;
  last = ts;
  if (!SRC || SRC.paused || SRC.ended || !SRC.videoWidth) return;

  const cols = P.density | 0;
  const aspect = SRC.videoWidth / SRC.videoHeight;
  const rows = Math.max(2, Math.floor(cols / aspect));

  buf.width = cols; buf.height = rows;
  if (P.mirror) { bctx.translate(cols, 0); bctx.scale(-1, 1); }
  bctx.drawImage(SRC, 0, 0, cols, rows);
  bctx.setTransform(1, 0, 0, 1, 0, 0);
  const px = bctx.getImageData(0, 0, cols, rows).data;

  const n = cols * rows;
  const lum = new Float32Array(n);
  const con = P.contrast / 25, bri = P.brightness * 2.2, gam = P.gamma / 100;
  for (let i = 0, p = 0; i < n; i++, p += 4) {
    let L = 0.299 * px[p] + 0.587 * px[p+1] + 0.114 * px[p+2];
    L = (L / 255 - 0.5) * con + 0.5;
    L = Math.max(0, Math.min(1, L + bri / 2550));
    L = Math.pow(L, gam);
    if (P.invert) L = 1 - L;
    lum[i] = L * 255;
  }
  // dither (ordered 2x2 bayer)
  if (P.dither > 0) {
    const amt = P.dither * 0.9;
    const bayer = [0, 2, 3, 1];
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++)
      lum[y * cols + x] += (bayer[(y & 1) * 2 + (x & 1)] / 4 - 0.5) * amt;
  }

  const fh = Math.max(7, Math.floor(window.innerHeight / rows));
  const fw = Math.max(4, fh * P.cellAspect / 100);
  const gs = P.glyphSize / 100;
  cv.width = cols * fw; cv.height = rows * fh;
  ctx.fillStyle = P.colMode === 'ink' ? '#f2efe6' : P.bgCol;
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.font = `${(fh * 0.98 * gs).toFixed(1)}px 'Courier New', monospace`;
  ctx.textBaseline = 'top';

  const ramp = activeRamp();
  const rl = ramp.length;
  const relief = P.relief / 100;
  const lx = Math.cos(P.lightAngle * Math.PI / 180), ly = Math.sin(P.lightAngle * Math.PI / 180);
  const edgeGain = P.edgeGain / 8;
  const eThresh = P.edgeThresh / 100;
  const DIRS = [['·','─','━','═','█'], ['·','╱','╱','▚','▓'], ['·','│','┃','║','█'], ['·','╲','╲','▞','▓']];
  const BMAP = [0x01,0x08,0x02,0x10,0x04,0x20,0x40,0x80];
  const toneMix = P.toneAmt / 100, edgeMix = P.edgeAmt / 100, brMix = P.brailleAmt / 100;

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const i = y * cols + x, p = i * 4;
      const xm = x > 0 ? x-1 : x, xp = x < cols-1 ? x+1 : x;
      const ym = y > 0 ? y-1 : y, yp = y < rows-1 ? y+1 : y;
      const L = lum[i];
      const g00 = lum[ym*cols+xm], g01 = lum[ym*cols+x], g02 = lum[ym*cols+xp];
      const g10 = lum[y*cols+xm], g12 = lum[y*cols+xp];
      const g20 = lum[yp*cols+xm], g21 = lum[yp*cols+x], g22 = lum[yp*cols+xp];
      const gxv = (g02 + 2*g12 + g22) - (g00 + 2*g10 + g20);
      const gyv = (g20 + 2*g21 + g22) - (g00 + 2*g01 + g02);
      const mag = Math.sqrt(gxv*gxv + gyv*gyv) / 1020;
      const mean = (g00+g01+g02+g10+g12+g20+g21+g22) / 8;
      const varr = ((g00-mean)**2 + (g01-mean)**2 + (g02-mean)**2 + (g10-mean)**2 + (g12-mean)**2 + (g20-mean)**2 + (g21-mean)**2 + (g22-mean)**2) / 8 / 4000;

      let ch = null, cr = px[p], cg = px[p+1], cb = px[p+2];
      let L2 = L;

      if (edgeMix > 0 && mag > eThresh) {
        // directional glyph, bivariate: angle bucket + magnitude weight
        const ang = (Math.atan2(gyv, gxv) * 180 / Math.PI + 360) % 180;
        let fam = DIRS[0];
        if (ang >= 22.5 && ang < 67.5) fam = DIRS[1];
        else if (ang >= 67.5 && ang < 112.5) fam = DIRS[2];
        else if (ang >= 112.5 && ang < 157.5) fam = DIRS[3];
        const w = Math.min(4, Math.floor(mag * 9 * edgeGain * (0.5 + relief)));
        ch = fam[w];
        const lit = (gxv * lx + gyv * ly) / (mag * 1020 + 1);
        const boost = relief * lit * 90;
        cr += boost; cg += boost; cb += boost;
      } else if (brMix > 0 && varr > (1 - brMix) * 0.4 && mag < 0.12) {
        // braille: sample 2x4 grid around cell
        let dots = 0;
        const BX = [0,0,0,0,1,1,1,1], BY = [0,1,2,3,0,1,2,3];
        for (let d = 0; d < 8; d++) {
          const sxx = Math.min(cols-1, x + BX[d]);
          const syy = Math.min(rows-1, ym + BY[d] * Math.max(1, yp - ym) / 3 | 0);
          const v = lum[syy * cols + sxx];
          if (v > mean + (0.5 - brMix) * 40) dots |= BMAP[d];
        }
        ch = dots ? String.fromCharCode(0x2800 + dots) : null;
      }
      if (!ch && toneMix > 0) {
        let t = Math.min(0.999, Math.max(0, L2 / 255));
        if (P.invert) t = 1 - t; // ink mode: dark char on light bg for dark areas
        ch = ramp[Math.floor((1 - t) * (rl - 1))];
        if (ch === ' ' || P.colMode === 'ink' && L2 < 20) ch = ch === ' ' ? null : ch;
      }
      if (!ch) continue;

      [cr, cg, cb] = cellColor(cr, cg, cb, L2);
      if (P.bloom > 0 && L2 > 200) {
        ctx.shadowColor = `rgba(${cr|0},${cg|0},${cb|0},0.9)`;
        ctx.shadowBlur = P.bloom;
      } else ctx.shadowBlur = 0;
      ctx.fillStyle = `rgb(${Math.max(0,Math.min(255,cr))|0},${Math.max(0,Math.min(255,cg))|0},${Math.max(0,Math.min(255,cb))|0})`;
      ctx.fillText(ch, x * fw, y * fh);
    }
  }
  ctx.shadowBlur = 0;

  // atmosphere: scanlines
  if (P.scan > 0) {
    ctx.fillStyle = 'rgba(0,0,0,' + (P.scan / 140) + ')';
    for (let sy = 0; sy < cv.height; sy += 3) ctx.fillRect(0, sy, cv.width, 1);
  }
  // grain
  if (P.grain > 0) {
    ctx.globalAlpha = P.grain / 500;
    for (let gy = 0; gy < cv.height; gy += 256) for (let gx = 0; gx < cv.width; gx += 256)
      ctx.drawImage(noise, gx + (Math.random()*8|0), gy + (Math.random()*8|0));
    ctx.globalAlpha = 1;
  }
  // vignette
  if (P.vignette > 0) {
    const vg = ctx.createRadialGradient(cv.width/2, cv.height/2, cv.height*0.35, cv.width/2, cv.height/2, cv.height*0.85);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, `rgba(0,0,0,${P.vignette/110})`);
    ctx.fillStyle = vg; ctx.fillRect(0, 0, cv.width, cv.height);
  }
}

if (MOCK) {
  // synthetic sculptural scene: moving light, shaded sphere, rotated bars,
  // checkerboard — exercises relief, directional glyphs, braille detail.
  const m = document.createElement('canvas'); m.width = 640; m.height = 480;
  m.videoWidth = 640; m.videoHeight = 480;
  m.paused = false; m.ended = false;
  const mctx = m.getContext('2d');
  let t = 0;
  (function dm() {
    const w = m.width, h = m.height;
    mctx.fillStyle = '#141414'; mctx.fillRect(0, 0, w, h);
    const lxp = w/2 + Math.cos(t/40) * w/3, lyp = h/2 + Math.sin(t/40) * h/3;
    const rg = mctx.createRadialGradient(lxp, lyp, 10, lxp, lyp, h*0.85);
    rg.addColorStop(0, '#f5eede'); rg.addColorStop(1, '#0a0a0a');
    mctx.fillStyle = rg; mctx.fillRect(0, 0, w, h);
    const bx = w/2 + Math.sin(t/25) * w/5, by = h/2 + Math.cos(t/17) * h/6;
    const sg = mctx.createRadialGradient(bx - 30, by - 30, 5, bx, by, 90);
    sg.addColorStop(0, '#fff'); sg.addColorStop(0.6, '#9a7a55'); sg.addColorStop(1, '#101010');
    mctx.fillStyle = sg; mctx.beginPath(); mctx.arc(bx, by, 90, 0, Math.PI*2); mctx.fill();
    mctx.save(); mctx.translate(w/2, h/2); mctx.rotate(t/90);
    mctx.fillStyle = '#e8e8e8'; mctx.fillRect(-230, -14, 460, 28);
    mctx.rotate(Math.PI/4); mctx.fillStyle = '#989898'; mctx.fillRect(-270, -10, 540, 20);
    mctx.restore();
    for (let cy = 0; cy < 8; cy++) for (let cx = 0; cx < 8; cx++)
      if ((cx + cy + (t >> 3)) % 2) { mctx.fillStyle = '#d8d8d8'; mctx.fillRect(470 + cx*16, 300 + cy*16, 16, 16); }
    t++;
    requestAnimationFrame(dm);
  })();
  SRC = m;
  requestAnimationFrame(loop);
} else {
  SRC = video;
  initCamera();
}
</script>
</body>
</html>
